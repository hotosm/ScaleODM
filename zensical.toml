[project]
site_name = "ScaleODM"
site_description = "Kubernetes-native orchestration for OpenDroneMap workloads."
site_url = "https://hotosm.github.io/ScaleODM/"
repo_name = "hotosm/ScaleODM"
repo_url = "https://github.com/hotosm/ScaleODM"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; HOTOSM"

nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Usage" = [
    { "NodeODM compatibility" = "nodeodm-compatibility.md" },
    { "Migrating from NodeODM" = "nodeodm-migrate.md" },
    { "API reference" = "api/index.html" },
  ] },
  { "Deployment" = [
    { "Memory sizing" = "system-requirements.md" },
    { "Swap" = "swap.md" },
    { "Helm chart" = "https://github.com/hotosm/ScaleODM/blob/main/chart/README.md" },
  ] },
  { "Development" = [
    { "Architecture" = "architecture.md" },
    { "Testing" = "testing.md" },
    { "Alternative ODM images" = "testing-alternative-images.md" },
  ] },
  { "Decisions" = [
    "decisions/README.md",
    "decisions/0000-hotosm.md",
    "decisions/0001-argo-workflows.md",
    "decisions/0002-s3.md",
    "decisions/0003-swap.md",
  ] },
]

[project.theme]
language = "en"
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
